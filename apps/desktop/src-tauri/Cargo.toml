[package]
name = "deyana-desktop"
version = "0.1.0"
description = "Deyana desktop shell"
authors = ["DEYANA"]
edition = "2021"

[lib]
name = "deyana_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "deyana-desktop"
path = "src/main.rs"

[[test]]
name = "react_loop_integration_tests"
path = "tests/react_loop_integration_tests.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = { version = "0.7", features = ["macros", "tokio"] }
reqwest-eventsource = "0.6"
tokio-util = { version = "0.7", features = ["codec"] }
sha2 = "0.10"
aes-gcm = "0.10"

futures-util = { version = "0.3", features = ["sink"] }
cpal = "0.15"
ringbuf = "0.4"
rustpotter = "3.0"
hound = "3.5"
tts = "0.26"
lru = "0.12"
sysinfo = "0.30"
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }





